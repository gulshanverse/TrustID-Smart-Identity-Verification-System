[project]
name = "trustid-api"
version = "0.1.0"
description = "TrustID modular monolith API foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<6.0",
  "python-multipart>=0.0.9,<1.0",
  "boto3>=1.35,<2.0",
  "reportlab>=4.2,<5.0",
  "Pillow>=10.4,<12.0",
  "pytesseract>=0.3.13,<1.0",
  "pypdf>=5.0,<7.0",
  "pdf2image>=1.17,<2.0",
  "opencv-contrib-python-headless>=4.10,<5.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PIL.*", "pytesseract", "numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true
